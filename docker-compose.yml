services:
  postgres:
    image: postgres:16-alpine
    container_name: omnilaunge-db
    environment:
      POSTGRES_USER: omnilaunge
      POSTGRES_PASSWORD: omnilaunge
      POSTGRES_DB: omnilaunge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilaunge -d omnilaunge"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: omnilaunge-server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://omnilaunge:omnilaunge@postgres:5432/omnilaunge
      PORT: "8000"
      # Dev-only value so `docker compose up` works out of the box locally.
      # Any real deployment MUST override this with its own secret, e.g.
      # `python -c "import secrets; print(secrets.token_urlsafe(48))"` --
      # anyone who can read this file can otherwise forge valid login tokens.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-do-not-use-in-production-1234567890}
      AUTH_ENABLE_LOCAL_REGISTRATION: ${AUTH_ENABLE_LOCAL_REGISTRATION:-true}
      # Off by default: the real-time game stays fully anonymous unless a
      # deployment explicitly opts into requiring a valid JWT on every
      # Socket.IO connection (design doc §16).
      AUTH_REQUIRE_SOCKET_AUTH: ${AUTH_REQUIRE_SOCKET_AUTH:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
