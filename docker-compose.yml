services:
  postgres:
    image: postgres:16-alpine
    container_name: hobboverse-db
    environment:
      POSTGRES_USER: hobboverse
      POSTGRES_PASSWORD: hobboverse
      POSTGRES_DB: hobboverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobboverse -d hobboverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: hobboverse-server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hobboverse:hobboverse@postgres:5432/hobboverse
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
