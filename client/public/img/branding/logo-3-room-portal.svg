<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img" aria-labelledby="l3title">
  <title id="l3title">OmniLaunge logo concept 3: Room Portal</title>
  <defs>
    <linearGradient id="og3-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2d68"/>
      <stop offset="1" stop-color="#1c5972"/>
    </linearGradient>
    <linearGradient id="og3-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4addb"/>
      <stop offset="1" stop-color="#7fd4ec"/>
    </linearGradient>
  </defs>

  <!-- Icon: an isometric-ish "room tile" (the same rounded-square unit the
       in-app builder grid uses) with a glowing doorway cut into it and a
       small star — "every room, always another one to open." -->
  <g transform="translate(6,6)">
    <rect x="2" y="2" width="66" height="66" rx="16" fill="url(#og3-tile)"/>
    <rect x="26" y="20" width="18" height="34" rx="6" fill="url(#og3-door)"/>
    <path d="M54 10 L57 17 L64 20 L57 23 L54 30 L51 23 L44 20 L51 17 Z" fill="#ffd9f3"/>
  </g>

  <text x="98" y="48" font-family="'Roboto','Segoe UI',sans-serif" font-size="30" font-weight="700" letter-spacing="1" fill="#eae0e8">OmniLaunge</text>
  <text x="98" y="70" font-family="'Roboto','Segoe UI',sans-serif" font-size="13" letter-spacing="3" fill="#cfc3d1">BUILD ANY ROOM</text>
</svg>
